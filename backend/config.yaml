# Familiar 設定（SDD 第 9 節）。API key 不放這裡，放在 .env 的 GEMINI_API_KEY。

gemini:
  models:                       # 每個模型的免費版配額（多條鏈共用）；0 = 未知
    gemini-4-hydrogen:     { rpm: 0, rpd: 20 }   # 第 0 週 429 訊息
    gemini-3.8-flash:      { rpm: 0, rpd: 0 }    # 尚未測到
    gemini-3.6-flash:      { rpm: 5, rpd: 20 }   # 第 0 週 429 訊息
    gemini-3.5-flash-lite: { rpm: 0, rpd: 0 }    # 尚未撞到上限
  backend: custom_fc            # 預設動作後端；可改為 native_cu
  chains:
    action:   [gemini-3.5-flash-lite, gemini-3.6-flash, gemini-3.8-flash]
    planning: [gemini-4-hydrogen, gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash-lite]
  overload:                     # 503 過載／逾時的處理：目前是「全速」設定（2026-11-24 依使用者要求）
    fallback_retries: 0         # 不重試：一失敗就換下一個模型
    fallback_backoff_sec: 0
    retries: 0                  # 最後一個可用模型也不重試
    backoff_sec: [0]
    cooldown_initial_sec: 3     # 失敗的模型只停用 3 秒（不能是 0：所有模型同時過載時會瞬間反覆呼叫）
    cooldown_max_min: 0.05      # 3 秒，不逐步加長
    # 想要穩一點的設定（較少失敗、但可能等比較久）：
    #   fallback_retries: 1, fallback_backoff_sec: 5, retries: 3, backoff_sec: [10, 20, 40],
    #   cooldown_initial_sec: 60, cooldown_max_min: 10
  decision:
    model: gemini-decision-1
    rpm: 200
    rpd: 10000
    tpm: 50000                  # 每分鐘輸入 token（第 0 週 429 訊息）
    screenshot_max_side: 1024
    confidence_threshold: 0.8
  actor:                        # 第 3 層：只需要點擊的步驟由 Decisions API 從畫面候選中挑選
    enabled: true
    mark_threshold: 0.8         # 選中選項的信心門檻（spike 04：答對時平均 0.96–0.99）
    risk_threshold: 0.5         # 「點了會不會不可復原」的機率超過這個值就要使用者確認
    max_candidates: 60
    stall_steps: 2              # 畫面連續幾步沒變化就改交給代理人模型
  completion_check:             # 模型說「完成了」之前，先用 Decisions API 看畫面確認，避免謊報成功
    enabled: true
    threshold: 0.5              # 「已完成」的機率低於這個值就退回給模型繼續做
    max_rejections: 2           # 退回 2 次後模型仍堅持完成 → 任務判定失敗（不算成功）
  reflex:                       # 反射層（遊戲模式）：代理人定規則，Decisions 每輪看畫面選規則、程式立刻按鍵
    enabled: true
    max_side: 512               # 送給 Decisions 的遊戲畫面長邊（越小越快、越省 token）
    threshold: 0.5              # 信心低於這個值視同「沒有規則符合」
    max_unknown: 3              # 連續幾輪沒有規則符合就交回代理人
    stall_ticks: 6              # 遊戲畫面連續幾輪沒變化就交回代理人
    max_iterations: 60          # 一次 set_reflex 最多跑幾輪
  enable_prompt_injection_detection: true

browser:
  viewport: { width: 1280, height: 800 }
  blocked_domains: []

desktop:
  emergency_stop_hotkey: "ctrl+alt+q"
  blocked_windows: [1Password, Bitwarden, KeePass]

server:
  host: "127.0.0.1"
  port: 8765
